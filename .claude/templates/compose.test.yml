# ШАБЛОН: окружение для интеграционных тестов.
# Извлечено из projects/01-testimonials-senja, 2026-08-27. Maturity: 🔴 Alpha.
# Заменить {{PROJECT}} на имя проекта в kebab-case.
#
# Тесты гоняются С ХОСТА (`npm test`), а сервисы — в контейнерах, поэтому порты здесь
# ПУБЛИКУЮТСЯ — в отличие от боевого docker-compose.yml, где у хранилищ только `expose:`.
# Это ЕДИНСТВЕННЫЙ законный повод опубликовать порт БД, и он обвешан тремя условиями ниже.
#
# ── Условие 1: явный 127.0.0.1 в КАЖДОЙ публикации ────────────────────────────
# Форма `-p 5432:5432` (без адреса) открывает порт на ВСЕ интерфейсы, включая публичный IP.
# Это не теория: 2026-08-26 тестовый Postgres, поднятый так, с паролем `postgres`, был
# взломан из интернета примерно за час — `COPY … TO PROGRAM` дал выполнение команд,
# и в контейнер лёг червь-майнер. «Необычный» номер порта защитой не является.
#
# ── Условие 2: пароли без дефолтов ────────────────────────────────────────────
# Форма `${VAR:?сообщение}` роняет запуск, если переменная не задана. Дефолт вида
# `${TEST_PG_PASSWORD:-postgres}` молча поднял бы базу с предсказуемым паролем — то есть
# ровно то, чем закончился инцидент.
#
#   export TEST_PG_PASSWORD=$(openssl rand -hex 24)
#   export TEST_MINIO_PASSWORD=$(openssl rand -hex 24)
#   docker compose -f compose.test.yml up -d
#
# ── Условие 3: собственное имя проекта ────────────────────────────────────────
# Без `name:` compose берёт имя каталога — то же самое, что у боевого docker-compose.yml, —
# и два стека начинают вытеснять друг друга: поднял демо, тестовые контейнеры молча
# заменились, тесты посыпались с ECONNREFUSED и выглядело это как поломка кода.
#
# Порты по умолчанию смещены, чтобы не конфликтовать с боевым стеком на той же машине.
# Перед первым запуском: bash scripts/check-port-conflicts.sh .

name: {{PROJECT}}-test

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: {{PROJECT}}_test
      POSTGRES_PASSWORD: "${TEST_PG_PASSWORD:?задайте TEST_PG_PASSWORD=$(openssl rand -hex 24)}"
      POSTGRES_DB: {{PROJECT}}_test
    # 127.0.0.1 ОБЯЗАТЕЛЕН. Не убирать. См. шапку файла.
    ports: ["127.0.0.1:${TEST_PG_PORT:-55432}:5432"]
    # Тестовая база одноразовая — том не нужен, tmpfs ещё и быстрее.
    tmpfs: ["/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Удалить весь блок, если проекту не нужно объектное хранилище.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data
    environment:
      MINIO_ROOT_USER: {{PROJECT}}_test
      MINIO_ROOT_PASSWORD: "${TEST_MINIO_PASSWORD:?задайте TEST_MINIO_PASSWORD=$(openssl rand -hex 24)}"
    ports: ["127.0.0.1:${TEST_MINIO_PORT:-59000}:9000"]
    tmpfs: ["/data"]
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 15

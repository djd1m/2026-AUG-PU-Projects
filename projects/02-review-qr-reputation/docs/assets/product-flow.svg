<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 790" width="640" height="790" role="img" aria-labelledby="flow-title flow-desc" lang="ru">
  <title id="flow-title">ReviewQR: от QR к выбору гостя</title>
  <desc id="flow-desc">Владелец настраивает QR. Гость сканирует его и сразу видит равноправный выбор: перейти на Яндекс.Карты или 2ГИС либо заполнить личную форму. Личное сообщение доставляется владельцу в Telegram. Переход на карты не означает публикацию отзыва. Все шаги видны без анимации.</desc>
  <style>
    svg { display:block; max-width:100%; height:auto; --bg:#f5f9ff; --card:#FFFFFF; --ink:#00132e; --muted:#405777; --line:#819dc2; --accent:#025bde; --soft:#e4efff; color-scheme:light dark; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; }
    .background { fill:var(--bg); }
    .card { fill:var(--card); stroke:var(--line); stroke-width:1.5; }
    .heading { fill:var(--ink); font-size:29px; font-weight:750; }
    .label { fill:var(--ink); font-size:22px; font-weight:700; }
    .copy { fill:var(--muted); font-size:19px; }
    .number { fill:var(--accent); font-size:20px; font-weight:750; }
    .badge { fill:var(--soft); }
    .edge { fill:none; stroke:var(--line); stroke-width:2.5; stroke-linejoin:round; marker-end:url(#arrow); }
    .arrow { fill:var(--line); }
    .marker { fill:var(--accent); stroke:var(--bg); stroke-width:2; animation-duration:10s; animation-timing-function:linear; animation-iteration-count:infinite; }
    #marker-qr { transform:translate(183px,242px); animation-name:qr-travel; }
    #marker-scan { transform:translate(183px,382px); animation-name:scan-travel; }
    #marker-maps { transform:translate(368px,425px); animation-name:maps-travel; }
    #marker-telegram { transform:translate(503px,632px); animation-name:telegram-travel; }
    #marker-private { transform:translate(368px,565px); animation-name:private-travel; }
    @keyframes qr-travel { 0% { transform:translate(183px,242px); opacity:1; } 19% { transform:translate(183px,260px); opacity:1; } 20%,100% { transform:translate(183px,260px); opacity:0; } }
    @keyframes scan-travel { 0%,19% { transform:translate(183px,382px); opacity:0; } 20% { transform:translate(183px,382px); opacity:1; } 39% { transform:translate(183px,400px); opacity:1; } 40%,100% { transform:translate(183px,400px); opacity:0; } }
    @keyframes maps-travel { 0%,39% { transform:translate(346px,455px); opacity:0; } 40% { transform:translate(346px,455px); opacity:1; } 47% { transform:translate(368px,455px); opacity:1; } 57% { transform:translate(368px,425px); opacity:1; } 64% { transform:translate(386px,425px); opacity:1; } 65%,100% { transform:translate(386px,425px); opacity:0; } }
    @keyframes private-travel { 0%,64% { transform:translate(346px,455px); opacity:0; } 65% { transform:translate(346px,455px); opacity:1; } 71% { transform:translate(368px,455px); opacity:1; } 82% { transform:translate(368px,565px); opacity:1; } 88% { transform:translate(386px,565px); opacity:1; } 89%,100% { transform:translate(386px,565px); opacity:0; } }
    @keyframes telegram-travel { 0%,89% { transform:translate(503px,632px); opacity:0; } 90% { transform:translate(503px,632px); opacity:1; } 97% { transform:translate(503px,646px); opacity:1; } 98%,100% { transform:translate(503px,646px); opacity:0; } }
    @media (prefers-color-scheme:dark) { svg { --bg:#00132e; --card:#102b50; --ink:#f5f9ff; --muted:#c5d6ed; --line:#86a8d4; --accent:#8ebcff; --soft:#183b66; } }
    @media (prefers-reduced-motion:reduce) { .marker { animation:none !important; opacity:1; } }
  </style>
  <defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path class="arrow" d="M1 1 7 4 1 7Z"/></marker></defs>
  <rect class="background" width="640" height="790" rx="24"/>
  <text class="heading" x="28" y="49">ReviewQR</text>
  <text class="copy" x="28" y="83">Один QR — выбор за гостем</text>
  <g aria-hidden="true">
    <path class="edge" d="M183 230V268"/>
    <path class="edge" d="M183 370V408"/>
    <path class="edge" d="M338 455H368V425H393"/>
    <path class="edge" d="M368 455V565H393"/>
    <path class="edge" d="M503 620V648"/>
  </g>
  <rect class="card" x="28" y="130" width="310" height="100" rx="18"/>
  <circle class="badge" cx="56" cy="160" r="16"/><text class="number" x="56" y="167" text-anchor="middle">1</text>
  <text class="label" x="82" y="168">Настройте QR</text>
  <text class="copy" x="48" y="205">В кабинете владельца</text>
  <rect class="card" x="28" y="270" width="310" height="100" rx="18"/>
  <circle class="badge" cx="56" cy="300" r="16"/><text class="number" x="56" y="307" text-anchor="middle">2</text>
  <text class="label" x="82" y="308">Сканируйте QR</text>
  <text class="copy" x="48" y="345">Камерой телефона</text>
  <rect class="card" x="28" y="410" width="310" height="100" rx="18"/>
  <circle class="badge" cx="56" cy="440" r="16"/><text class="number" x="56" y="447" text-anchor="middle">3</text>
  <text class="label" x="82" y="448">Выбор гостя</text>
  <text class="copy" x="48" y="485">Карты или лично</text>
  <rect class="card" x="395" y="370" width="217" height="110" rx="18"/>
  <circle class="badge" cx="423" cy="400" r="16"/><text class="number" x="423" y="407" text-anchor="middle">4</text>
  <text class="label" x="449" y="408">На карты</text>
  <text class="copy" x="415" y="447">Яндекс / 2ГИС</text>
  <rect class="card" x="395" y="510" width="217" height="110" rx="18"/>
  <circle class="badge" cx="423" cy="540" r="16"/><text class="number" x="423" y="547" text-anchor="middle">5</text>
  <text class="label" x="449" y="548">Лично</text>
  <text class="copy" x="415" y="587">Форма гостя</text>
  <rect class="card" x="395" y="650" width="217" height="100" rx="18"/>
  <circle class="badge" cx="423" cy="680" r="16"/><text class="number" x="423" y="687" text-anchor="middle">6</text>
  <text class="label" x="449" y="688">Telegram</text>
  <text class="copy" x="415" y="725">Владельцу</text>
  <text class="copy" x="28" y="600">Обе двери доступны</text>
  <text class="copy" x="28" y="628">сразу, без оценки</text>
  <g aria-hidden="true">
    <g class="marker" id="marker-qr"><circle r="6"/></g>
    <g class="marker" id="marker-scan"><circle r="6"/></g>
    <g class="marker" id="marker-maps"><circle r="6"/></g>
    <g class="marker" id="marker-private"><circle r="6"/></g>
    <g class="marker" id="marker-telegram"><circle r="6"/></g>
  </g>
</svg>

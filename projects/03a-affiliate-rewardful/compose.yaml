name: ${N3A_COMPOSE_PROJECT:-n3a-affiliate}
services:
  db:
    restart: unless-stopped
    image: postgres:16.15-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    environment:
      POSTGRES_USER: n3a_admin
      POSTGRES_DB: n3a
      POSTGRES_PASSWORD: ${N3A_DB_ADMIN_PASSWORD:?explicit administrator password required}
      N3A_DB_APP_PASSWORD: ${N3A_DB_APP_PASSWORD:?explicit application password required}
      N3A_DB_MIGRATE_PASSWORD: ${N3A_DB_MIGRATE_PASSWORD:?explicit migration password required}
    expose: ["5432"]
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./scripts/init-foundation-db.sh:/docker-entrypoint-initdb.d/10-n3a.sh:ro
    networks: [private]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n3a_admin -d n3a"]
      interval: 2s
      timeout: 2s
      retries: 20
  web:
    restart: unless-stopped
    profiles: [app]
    build: .
    environment:
      NODE_ENV: production
      N3A_LISTEN_HOST: 0.0.0.0
      DATABASE_URL: postgresql://n3a_app:${N3A_DB_APP_PASSWORD:?required}@db:5432/n3a
      SESSION_SECRET: ${SESSION_SECRET:?explicit session secret required}
      IDENTITY_SECRET: ${IDENTITY_SECRET:?explicit identity secret required}
      ADMISSION_SECRET: ${ADMISSION_SECRET:?explicit admission secret required}
      APP_ORIGIN: ${APP_ORIGIN:?explicit application origin required}
    ports: ["127.0.0.1:${N3A_WEB_PORT:-4183}:3000"]
    networks: [private]
    depends_on:
      db: { condition: service_healthy }
  test:
    profiles: [test]
    image: node:22.22.0-bookworm-slim@sha256:dd9d21971ec4395903fa6143c2b9267d048ae01ca6d3ea96f16cb30df6187d94
    working_dir: /workspace
    volumes: [".:/workspace"]
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: postgresql://n3a_app:${N3A_DB_APP_PASSWORD:?required}@db:5432/n3a
      DATABASE_URL_MIGRATE: postgresql://n3a_migrator:${N3A_DB_MIGRATE_PASSWORD:?required}@db:5432/n3a
      N3A_DISPOSABLE_TEST_NAMESPACE: ${N3A_COMPOSE_PROJECT:?required}
      TEST_DATABASE_URL: postgresql://n3a_app:${N3A_DB_APP_PASSWORD:?required}@db:5432/n3a
      TEST_DATABASE_URL_MIGRATE: postgresql://n3a_migrator:${N3A_DB_MIGRATE_PASSWORD:?required}@db:5432/n3a
      SESSION_SECRET: ${SESSION_SECRET:?required}
      IDENTITY_SECRET: ${IDENTITY_SECRET:?required}
      ADMISSION_SECRET: ${ADMISSION_SECRET:?required}
      APP_ORIGIN: ${APP_ORIGIN:?required}
    networks: [private]
    depends_on:
      db: { condition: service_healthy }
networks:
  private:
    internal: true
volumes:
  db-data:

# Тестовый стек N6b: typecheck + unit + integration контейнером против настоящего Postgres + pgvector.
# name: n6b-test — иначе compose возьмёт имя каталога и вытеснит рабочий стек n6b (compose-hygiene.md п. 1).
# БД без ports: и во внутренней сети — снаружи недостижима (Правило №0). Пароли — ${VAR:?} без значений по умолчанию.
# Запуск и уборка — DEVELOPMENT_GUIDE.md §5.
name: n6b-test

services:
  db:
    image: pgvector/pgvector:0.8.6-pg16
    environment:
      POSTGRES_DB: n6b_test
      POSTGRES_USER: n6b_owner
      POSTGRES_PASSWORD: ${TEST_DB_PASSWORD:?TEST_DB_PASSWORD не задан — тестовая БД без пароля не поднимается}
    networks: [test]
    # никакого ports: — раннер ходит на db:5432 по сети compose
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n6b_owner -d n6b_test"]
      interval: 2s
      timeout: 5s
      retries: 30
    cpus: 2
    restart: "no"

  tests:
    build:
      context: .
      dockerfile: tests/compose/Dockerfile
    image: n6b-test-runner:local
    environment:
      TEST_DATABASE_URL_OWNER: postgresql://n6b_owner:${TEST_DB_PASSWORD:?TEST_DB_PASSWORD не задан}@db:5432/n6b_test
      TEST_TENANT_PASSWORD: ${TEST_TENANT_PASSWORD:?TEST_TENANT_PASSWORD не задан — роль кабинета не подключится}
      TEST_SERVICE_PASSWORD: ${TEST_SERVICE_PASSWORD:?TEST_SERVICE_PASSWORD не задан — служебная роль не подключится}
      TZ: Europe/Moscow
    networks: [test]
    depends_on:
      db:
        condition: service_healthy
    cpus: 2
    restart: "no"

networks:
  test:
    internal: true          # ни БД, ни раннер не ходят в интернет и недостижимы снаружи

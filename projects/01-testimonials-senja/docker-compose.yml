services:
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB
      - POSTGRES_USER
      - POSTGRES_PASSWORD       # секреты — только имена переменных, значения в .env / secrets
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    # Тег закреплён: `minio/minio` без тега = :latest — невоспроизводимая сборка,
    # на VPS через месяц приедет другой образ (D-008, Phase 3 /start).
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data
    environment:
      - MINIO_ROOT_USER
      - MINIO_ROOT_PASSWORD
    volumes:
      - minio_data:/data
    expose: ["9000"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .                        # корень монорепо: package-lock.json только здесь
      dockerfile: apps/web/Dockerfile
    environment:
      - DATABASE_URL             # postgres:// строка, включает роли app_authenticated/app_service
      - SESSION_SECRET
      - S3_ENDPOINT
      - S3_BUCKET
      - S3_ACCESS_KEY
      - S3_SECRET_KEY
      - TRANSCRIBE_SERVICE_URL=http://transcribe:7331
      - PAYMENT_WEBHOOK_SECRET   # FR-008: onPaymentWebhook/applyTariffUpgrade исполняются в apps/web (§3.5)
    # Хостовая часть — через переменную: на машине, где 3000 занят другим проектом,
    # правится .env, а не общий compose (см. .claude/rules/docker-ports.md).
    ports: ["${WEB_PORT:-3000}:3000"]
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      transcribe:
        condition: service_healthy

  worker:
    build:
      context: .                        # корень монорепо: package-lock.json только здесь
      dockerfile: services/worker/Dockerfile
    environment:
      - DATABASE_URL
      - S3_ENDPOINT
      - S3_BUCKET
      - S3_ACCESS_KEY
      - S3_SECRET_KEY
      - TRANSCRIBE_SERVICE_URL=http://transcribe:7331
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      transcribe:
        condition: service_healthy

  # D-007 / ADR-005: раньше mcp-claude — Claude API не принимает аудио, переехало на OpenAI STT.
  transcribe:
    build:
      context: .                        # корень монорепо: package-lock.json только здесь
      dockerfile: services/transcribe/Dockerfile
    environment:
      - OPENAI_API_KEY           # только он: сервис делает ТОЛЬКО транскрипцию (ADR-005)
      - OPENAI_TRANSCRIBE_MODEL  # опционально; дефолт gpt-4o-mini-transcribe (config.ts)
    expose: ["7331"]

  caddy:
    image: caddy:2-alpine
    # 80/443 — самые конфликтные порты на любой машине: их почти всегда уже слушает
    # чужой reverse-proxy. На этой машине их занимает контейнер ai-hub-tls-proxy,
    # поэтому значения по умолчанию вынесены в переменные, а не зашиты.
    ports: ["${HTTP_PORT:-80}:80", "${HTTPS_PORT:-443}:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
    depends_on:
      web:
        condition: service_started

volumes:
  postgres_data:
  minio_data:
  caddy_data:

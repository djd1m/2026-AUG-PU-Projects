<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#7C2BFF"/>
      <stop offset="0.55" stop-color="#6701EF"/>
      <stop offset="1"   stop-color="#3A0A8C"/>
    </linearGradient>
  </defs>

  <!-- Фон: скруглённый квадрат в фирменном фиолетовом продукта -->
  <rect width="512" height="512" rx="116" ry="116" fill="url(#bg)"/>

  <!-- КАВЫЧКА — знак отзыва. Два блока с «хвостом», крупные: в окне согласия
       иконка показывается мелко, и тонкая деталь там не выживет. -->
  <g fill="#FFFFFF">
    <path d="M150 132
             h74 a26 26 0 0 1 26 26
             v70 a96 96 0 0 1 -62 90
             a14 14 0 0 1 -19 -13
             v-22 a14 14 0 0 1 9 -13
             a44 44 0 0 0 27 -34
             h-55 a26 26 0 0 1 -26 -26
             v-52 a26 26 0 0 1 26 -26 z"/>
    <path d="M288 132
             h74 a26 26 0 0 1 26 26
             v70 a96 96 0 0 1 -62 90
             a14 14 0 0 1 -19 -13
             v-22 a14 14 0 0 1 9 -13
             a44 44 0 0 0 27 -34
             h-55 a26 26 0 0 1 -26 -26
             v-52 a26 26 0 0 1 26 -26 z"/>
  </g>

  <!-- СТЕНА — кладка со смещением рядов, как в настоящей кирпичной стене.
       Приглушена, чтобы не спорить с кавычкой за внимание. -->
  <g fill="#FFFFFF" opacity="0.42">
    <rect x="96"  y="348" width="126" height="42" rx="14"/>
    <rect x="238" y="348" width="178" height="42" rx="14"/>
    <rect x="96"  y="406" width="178" height="42" rx="14"/>
    <rect x="290" y="406" width="126" height="42" rx="14"/>
  </g>
</svg>

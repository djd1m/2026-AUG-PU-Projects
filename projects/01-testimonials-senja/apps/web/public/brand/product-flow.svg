<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 650" width="640" height="650" role="img" aria-labelledby="flow-title flow-desc" lang="ru">
  <title id="flow-title">Proofwall: от ссылки к отзывам на сайте</title>
  <desc id="flow-desc">Владелец отправляет ссылку. Клиент пишет текстовый отзыв без регистрации. Владелец решает, публиковать ли его. Одобренный отзыв попадает на публичную стену и во встраиваемый виджет сайта. Движущиеся точки показывают порядок; все шаги видны и без анимации.</desc>
  <style>
    svg { display:block; max-width:100%; height:auto; --bg:#F7F3FF; --card:#FFFFFF; --ink:#1E0A3C; --muted:#58466E; --line:#A486CF; --accent:#6701EF; --soft:#EDE1FF; color-scheme:light dark; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; }
    .background { fill:var(--bg); }
    .card { fill:var(--card); stroke:var(--line); stroke-width:1.5; }
    .heading { fill:var(--ink); font-size:29px; font-weight:750; }
    .label { fill:var(--ink); font-size:22px; font-weight:700; }
    .copy { fill:var(--muted); font-size:19px; }
    .number { fill:var(--accent); font-size:20px; font-weight:750; }
    .badge { fill:var(--soft); }
    .edge { fill:none; stroke:var(--line); stroke-width:2.5; stroke-linejoin:round; marker-end:url(#arrow); }
    .arrow { fill:var(--line); }
    .marker { fill:var(--accent); stroke:var(--bg); stroke-width:2; animation-duration:10s; animation-timing-function:linear; animation-iteration-count:infinite; }
    #marker-link { transform:translate(183px,242px); animation-name:link-travel; }
    #marker-review { transform:translate(183px,382px); animation-name:review-travel; }
    #marker-wall { transform:translate(368px,425px); animation-name:wall-travel; }
    #marker-widget { transform:translate(368px,555px); animation-name:widget-travel; }
    @keyframes link-travel { 0% { transform:translate(183px,242px); opacity:1; } 19% { transform:translate(183px,260px); opacity:1; } 20%,100% { transform:translate(183px,260px); opacity:0; } }
    @keyframes review-travel { 0%,19% { transform:translate(183px,382px); opacity:0; } 20% { transform:translate(183px,382px); opacity:1; } 39% { transform:translate(183px,400px); opacity:1; } 40%,100% { transform:translate(183px,400px); opacity:0; } }
    @keyframes wall-travel { 0%,39% { transform:translate(346px,455px); opacity:0; } 40% { transform:translate(346px,455px); opacity:1; } 47% { transform:translate(368px,455px); opacity:1; } 57% { transform:translate(368px,425px); opacity:1; } 64% { transform:translate(386px,425px); opacity:1; } 65%,100% { transform:translate(386px,425px); opacity:0; } }
    @keyframes widget-travel { 0%,64% { transform:translate(346px,455px); opacity:0; } 65% { transform:translate(346px,455px); opacity:1; } 71% { transform:translate(368px,455px); opacity:1; } 90% { transform:translate(368px,555px); opacity:1; } 97% { transform:translate(386px,555px); opacity:1; } 98%,100% { transform:translate(386px,555px); opacity:0; } }
    @media (prefers-color-scheme:dark) { svg { --bg:#1E0A3C; --card:#2D164D; --ink:#FAF7FF; --muted:#D5C4EA; --line:#9874C4; --accent:#CBA8FF; --soft:#43236B; } }
    @media (prefers-reduced-motion:reduce) { .marker { animation:none !important; opacity:1; } }
  </style>
  <defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path class="arrow" d="M1 1 7 4 1 7Z"/></marker></defs>
  <rect class="background" width="640" height="650" rx="24"/>
  <text class="heading" x="28" y="49">Proofwall</text>
  <text class="copy" x="28" y="83">Отзывы клиентов — на вашем сайте</text>
  <g aria-hidden="true">
    <path class="edge" d="M183 230V268"/>
    <path class="edge" d="M183 370V408"/>
    <path class="edge" d="M338 455H368V425H393"/>
    <path class="edge" d="M368 455V555H393"/>
  </g>
  <rect class="card" x="28" y="130" width="310" height="100" rx="18"/>
  <circle class="badge" cx="56" cy="160" r="16"/><text class="number" x="56" y="167" text-anchor="middle">1</text>
  <text class="label" x="82" y="168">Отправьте ссылку</text>
  <text class="copy" x="48" y="205">Довольному клиенту</text>
  <rect class="card" x="28" y="270" width="310" height="100" rx="18"/>
  <circle class="badge" cx="56" cy="300" r="16"/><text class="number" x="56" y="307" text-anchor="middle">2</text>
  <text class="label" x="82" y="308">Получите отзыв</text>
  <text class="copy" x="48" y="345">Текст, без регистрации</text>
  <rect class="card" x="28" y="410" width="310" height="100" rx="18"/>
  <circle class="badge" cx="56" cy="440" r="16"/><text class="number" x="56" y="447" text-anchor="middle">3</text>
  <text class="label" x="82" y="448">Одобрите отзыв</text>
  <text class="copy" x="48" y="485">Одобрите публикацию</text>
  <rect class="card" x="395" y="370" width="217" height="110" rx="18"/>
  <circle class="badge" cx="423" cy="400" r="16"/><text class="number" x="423" y="407" text-anchor="middle">4</text>
  <text class="label" x="449" y="408">Стена</text>
  <text class="copy" x="415" y="447">Страница отзывов</text>
  <rect class="card" x="395" y="500" width="217" height="110" rx="18"/>
  <circle class="badge" cx="423" cy="530" r="16"/><text class="number" x="423" y="537" text-anchor="middle">5</text>
  <text class="label" x="449" y="538">Виджет</text>
  <text class="copy" x="415" y="577">Блок на сайте</text>
  <text class="copy" x="28" y="566">На стене и в виджете —</text>
  <text class="copy" x="28" y="594">одобренные отзывы</text>
  <g aria-hidden="true">
    <g class="marker" id="marker-link"><circle r="6"/></g>
    <g class="marker" id="marker-review"><circle r="6"/></g>
    <g class="marker" id="marker-wall"><circle r="6"/></g>
    <g class="marker" id="marker-widget"><circle r="6"/></g>
  </g>
</svg>

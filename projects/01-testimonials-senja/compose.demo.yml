# Оверрайд для публичного демо за УЖЕ РАБОТАЮЩИМ на машине Caddy (ai-hub-tls-proxy).
#
# Запуск:
#   docker compose -f docker-compose.yml -f compose.demo.yml up -d
#
# Отличия от боевого docker-compose.yml:
#   1. Собственный caddy выключен профилем — 80/443 на машине уже заняты чужим прокси,
#      и поднимать второй бессмысленно (см. .claude/rules/docker-ports.md).
#   2. web дополнительно включён в ВНЕШНЮЮ сеть прокси, чтобы тот достучался по имени.
#      Наружу при этом не публикуется НИ ОДИН порт — единственная дверь у прокси.
#
# Хранилища (postgres, minio) остаются во внутренней сети и недоступны снаружи —
# «Правило №0»: база не публикуется никогда.

services:
  caddy:
    # Профиль, который никогда не включают, — способ исключить сервис из запуска.
    profiles: ["unused-in-demo"]

  web:
    networks:
      default: {}
      proxy: {}

networks:
  proxy:
    external: true
    name: talk-ai-public

# Overlay for the existing stack: preserve its database and named volumes.
name: n8-interior-local
# Public HTTPS: only proxy publishes, stores remain on private default network.
services:
  web:
    ports: !reset []
    networks:
      default: {}
      edge:
        ipv4_address: ${N8_WEB_EDGE_IP:-172.29.8.3}
    environment:
      N8_PUBLIC_ORIGIN: https://${N8_PUBLIC_HOST:?Set public host}
      N8_TRUSTED_PROXY_IP: ${N8_PROXY_IP:-172.29.8.2}
  worker:
    environment:
      N8_PUBLIC_ORIGIN: https://${N8_PUBLIC_HOST:?Set public host}
      N8_TRUSTED_PROXY_IP: ${N8_PROXY_IP:-172.29.8.2}
  proxy:
    image: caddy:2-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    environment:
      N8_PUBLIC_HOST: ${N8_PUBLIC_HOST:?Set public host}
    ports:
      - "0.0.0.0:${N8_PROXY_HTTP_PORT:-80}:80"
      - "0.0.0.0:${N8_PROXY_HTTPS_PORT:-443}:443"
    volumes:
      - ./config/public/Caddyfile:/etc/caddy/Caddyfile:ro
      - tls-data:/data
      - tls-config:/config
    networks:
      edge:
        ipv4_address: ${N8_PROXY_IP:-172.29.8.2}
    depends_on:
      web: {condition: service_healthy}
    restart: unless-stopped
    mem_limit: 256m
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:2019/config/']
      interval: 10s
      timeout: 3s
      retries: 10
networks:
  edge:
    ipam:
      config:
        - subnet: ${N8_PROXY_SUBNET:-172.29.8.0/24}
volumes:
  tls-data:
  tls-config:

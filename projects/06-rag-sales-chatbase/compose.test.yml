# N6 — тестовый стек: настоящие Postgres 16 + pgvector 0.8.6 и Redis 7.4, раннер vitest в образе.
# из N5: projects/05-podcast-clips-opus/docker-compose.yml (профиль test) — вынесен в отдельный файл
# с `name:` (compose-hygiene правило 1: иначе стеки вытесняют друг друга), без MinIO.
# Запуск (--build обязателен: без него прогон молча проверяет старый образ):
#   docker compose -f compose.test.yml --project-directory . --env-file <вне репо> run --rm --build test
#   docker compose -f compose.test.yml --project-directory . --env-file <вне репо> down -v
# Портов на хосте НЕТ ни у одного сервиса: раннер ходит к db/redis по именам в сети compose.
name: n6-test

services:
  db:
    image: pgvector/pgvector:0.8.6-pg16
    environment:
      POSTGRES_DB: n6
      POSTGRES_USER: n6
      POSTGRES_PASSWORD: ${N6_DB_PASSWORD:?пароль БД не задан — openssl rand -hex 24}
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n6 -d n6"]
      interval: 3s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?пароль Redis не задан}
    command: ["sh", "-c", "exec redis-server --appendonly no --maxmemory-policy noeviction --requirepass \"$$REDIS_PASSWORD\""]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 3s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  test:
    build:
      context: .
      dockerfile: Dockerfile
      target: test
    image: n6-sufler-test:${IMAGE_TAG:-dev}
    # отдельная БД *_test: test-db.mjs создаёт её и отказывает на любом другом имени
    command: ["sh", "-c", "node scripts/test-db.mjs && npm test -- --run"]
    environment:
      NODE_ENV: test
      TZ: Europe/Moscow
      N6_ACCEPTANCE: "1"
      DATABASE_URL: postgresql://n6:${N6_DB_PASSWORD:?пароль БД не задан}@db:5432/n6_test
      REDIS_URL: redis://:${REDIS_PASSWORD:?пароль Redis не задан}@redis:6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # одноразовый раннер: перезапуск превратил бы красный прогон в бесконечный цикл
    restart: "no"
